<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Solar System</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);
            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030e2a;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #030e2a">
      <a-assets>
        <a-asset-item id="model-glb" src="박현준_202401500_DP_02반_10주차실습.glb"></a-asset-item>
      </a-assets>

      <a-entity starfield></a-entity>

      <!-- 환경광 -->
      <a-entity light="type: ambient; color: #223; intensity: 0.35"></a-entity>

      <!-- 태양 조명 -->
      <a-entity
        light="type: point; color: #FFF8E0; intensity: 2.5; distance: 130"
        position="0 0 -5">
      </a-entity>

      <!-- 카메라 (기본 위치 0 1.6 0, 마우스 드래그로 시점 회전 가능) -->
      <a-camera></a-camera>

      <!-- ☀️ 태양 -->
      <a-sphere
        position="0 0 -5"
        radius="1.3"
        color="#FDB813"
        material="shader: flat; emissive: #FF8C00; emissiveIntensity: 1; roughness: 1; metalness: 0;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;">
      </a-sphere>

      <!-- 🪐 수성 (Mercury) - 회색, 반지름 0.07, 궤도 2.0 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 2400; easing: linear;">
        <a-sphere
          position="0 2.0 0"
          radius="0.07"
          color="#A0A0A0"
          material="roughness: 0.95; metalness: 0.1;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1500; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🌕 금성 (Venus) - 연노랑, 반지름 0.17, 궤도 3.2 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 6200; easing: linear;">
        <a-sphere
          position="0 3.2 0"
          radius="0.17"
          color="#E8C870"
          material="roughness: 0.9; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🌍 지구 (Earth) - 파란색, 반지름 0.18, 궤도 4.5 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 10000; easing: linear;">
        <a-sphere
          position="0 4.5 0"
          radius="0.18"
          color="#1976D2"
          material="roughness: 0.7; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🔴 화성 (Mars) - 붉은색, 반지름 0.10, 궤도 5.8 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 18800; easing: linear;">
        <a-sphere
          position="0 5.8 0"
          radius="0.10"
          color="#C1440E"
          material="roughness: 0.9; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2200; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🟠 목성 (Jupiter) - 주황갈색, 반지름 0.65, 궤도 8.5 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 25000; easing: linear;">
        <a-sphere
          position="0 8.5 0"
          radius="0.65"
          color="#C88B3A"
          material="roughness: 0.9; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1800; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🪐 토성 (Saturn) - 연황색 + 고리, 반지름 0.55, 궤도 11.5 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 40000; easing: linear;">
        <a-sphere
          position="0 11.5 0"
          radius="0.55"
          color="#EAD88A"
          material="roughness: 0.9; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear;">
        </a-sphere>
        <!-- 토성 고리 -->
        <a-torus
          position="0 11.5 0"
          radius="1.0"
          radius-tubular="0.07"
          rotation="90 0 0"
          color="#C2A875"
          material="side: double; transparent: true; opacity: 0.75; roughness: 1; metalness: 0;">
        </a-torus>
      </a-entity>

      <!-- 🔵 천왕성 (Uranus) - 청록색, 반지름 0.33, 궤도 14.5 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 60000; easing: linear;">
        <a-sphere
          position="0 14.5 0"
          radius="0.33"
          color="#7FE8E8"
          material="roughness: 0.8; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1700; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🔵 해왕성 (Neptune) - 짙은 파란색, 반지름 0.31, 궤도 17.5 -->
      <a-entity
        position="0 0 -5"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 80000; easing: linear;">
        <a-sphere
          position="0 17.5 0"
          radius="0.31"
          color="#3F54BA"
          material="roughness: 0.8; metalness: 0.0;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 1600; easing: linear;">
        </a-sphere>
      </a-entity>

      <!-- 🚀 10주차 GLB 모델 - 행성들과 함께 공전 및 자전하며 떠다님 -->
      <a-entity
        position="0 0 -5"
        rotation="0 25 10"
        animation="property: rotation; to: 360 25 10; loop: true; dur: 22000; easing: linear;">
        <a-entity
          gltf-model="#model-glb"
          position="0 6.8 0"
          scale="1.2 1.2 1.2"
          animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear;">
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
